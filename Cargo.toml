[workspace]
resolver = "2"
members = [
    "crates/domain",
    "crates/perception",
    "crates/social",
    "crates/narrative",
    "crates/sim",
    "crates/agents",
    "crates/speech",
    "crates/persistence",
    "crates/content",
    "crates/eval",
    "crates/inference",
    "apps/scenario-runner",
    "apps/game",
    "apps/model-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.91"

[workspace.dependencies]
rpg_domain = { path = "crates/domain" }
rpg_perception = { path = "crates/perception" }
rpg_social = { path = "crates/social" }
rpg_narrative = { path = "crates/narrative" }
rpg_sim = { path = "crates/sim" }
rpg_agents = { path = "crates/agents" }
rpg_speech = { path = "crates/speech" }
rpg_persistence = { path = "crates/persistence" }
rpg_content = { path = "crates/content" }
rpg_eval = { path = "crates/eval" }
rpg_inference = { path = "crates/inference" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
proptest = "1"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
inherits = "release"
