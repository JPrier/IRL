[package]
name = "rpg_persistence"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agentic RPG: versioned snapshots and a transactional SQLite event store."

[dependencies]
rpg_domain.workspace = true
rpg_sim.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# SQLite is a native-only store; the browser build keeps the same versioned
# JSON save format and must not link C code.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rusqlite.workspace = true

[dev-dependencies]
tempfile = "3"
rpg_content.workspace = true
