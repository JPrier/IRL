[package]
name = "rpg_web_runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Agentic RPG: the browser runtime. Drives the shared authoritative SimCore from the browser event loop, with OpenRouter requests, speech and storage as nonblocking futures."

[dependencies]
rpg_domain.workspace = true
rpg_eval.workspace = true
rpg_runtime.workspace = true
rpg_openrouter.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "console"] }
