name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

# Bevy + llama.cpp + sherpa-onnx produce very large debug artifacts. Dropping
# debuginfo keeps the hosted runners from filling their disk and speeds links.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      # `rpg_inference` links llama.cpp via `llama-cpp-sys-2`, whose bindgen
      # build needs libclang. `apps/bevy-game` pulls winit, which needs the
      # Wayland/X11 development libraries, and `cpal` needs ALSA.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev clang pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      # `rust-cache` can restore a `target` whose sherpa-onnx prebuilt directory
      # is incomplete while its build-script fingerprint still looks fresh, so
      # cargo skips re-extraction and linking fails with `LNK1181`. Remove the
      # prebuilt and the fingerprint so the build script re-downloads it.
      - name: Repair sherpa-onnx prebuilt cache
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys || true
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev clang pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll') {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host 'LLVM not found in the default location; bindgen must discover libclang itself.'
          }
      # `rust-cache` can restore a `target` whose sherpa-onnx prebuilt directory
      # is incomplete while its build-script fingerprint still looks fresh, so
      # cargo skips re-extraction and linking fails with `LNK1181`. Remove the
      # prebuilt and the fingerprint so the build script re-downloads it.
      - name: Repair sherpa-onnx prebuilt cache
        shell: bash
        run: |
          rm -rf target/sherpa-onnx-prebuilt
          cargo clean -p sherpa-onnx-sys || true
      - run: cargo test --workspace
      - run: cargo run -q -p scenario-runner -- --seed 2026
      # Diagnostic (non-neural) speech/WAV buffer benchmark. Run through
      # `rpg_speech` rather than `model-bench`: the latter links llama.cpp and
      # the static onnxruntime together, whose initialisers abort with
      # `std::bad_alloc` on some Linux runners before `main` runs. This example
      # exercises the identical WAV/buffer-accounting path.
      - run: cargo run -q -p rpg_speech --example speech_bench

  # The browser build: compile the real game to WebAssembly, prove the
  # browser dependency graph has no native-only code, then run the Playwright
  # smoke suite against the built static site (OpenRouter mocked; no paid
  # calls, no secrets).
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      # rust-toolchain.toml pins the workspace toolchain; make sure that pinned
      # toolchain has the wasm target too.
      - name: Add wasm target to the pinned toolchain
        run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      - name: Install wasm-bindgen CLI (matching Cargo.lock)
        run: |
          WANT=$(awk '/^name = "wasm-bindgen"$/{getline; gsub(/"/,"",$3); print $3; exit}' Cargo.lock)
          if ! command -v wasm-bindgen >/dev/null || [ "$(wasm-bindgen --version | awk '{print $2}')" != "$WANT" ]; then
            cargo install wasm-bindgen-cli --version "$WANT" --locked --force
          fi
      - name: Install binaryen (wasm-opt)
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Browser dependency isolation
        run: |
          cargo tree -p web-game --target wasm32-unknown-unknown -e normal --prefix none > web-deps.txt
          if grep -Ei '^(rusqlite|libsqlite3|llama-cpp|sherpa-onnx|onnx|ort|alsa|cpal|ureq|rustls|ring|webpki|rpg_speech|rpg_inference)[-_a-z0-9]* v' web-deps.txt; then
            echo "native-only crates leaked into the browser build"; exit 1
          fi
          echo "$(sort -u web-deps.txt | wc -l) crates in the browser graph, none native-only"
      - name: Clippy (wasm32)
        run: cargo clippy -p web-game -p rpg_web_runtime -p rpg_openrouter -p irl_client -p rpg_runtime --target wasm32-unknown-unknown -- -D warnings
      - name: Build the browser client
        run: ./scripts/web-build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: irl-web
          path: dist/web
          if-no-files-found: error
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        working-directory: apps/web-game/tests
        run: |
          npm ci
          npx playwright install --with-deps chromium firefox
      - name: Browser smoke tests
        working-directory: apps/web-game/tests
        run: npx playwright test smoke.spec.js perf.spec.js --project=chromium 2>&1 | tee playwright-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      # Firefox needs a display for WebGL2 on a GPU-less runner: headed under
      # Xvfb with Mesa software GL.
      - name: Browser smoke tests (Firefox, Xvfb)
        if: always()
        working-directory: apps/web-game/tests
        env:
          IRL_FIREFOX_HEADED: "1"
        shell: bash
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          xvfb-run -a -s "-screen 0 1600x1000x24" npx playwright test smoke.spec.js perf.spec.js --project=firefox 2>&1 | tee -a playwright-output.txt; exit ${PIPESTATUS[0]}
      - name: Test summary
        if: always()
        working-directory: apps/web-game/tests
        shell: bash
        run: |
          {
            echo '### Browser tests'
            echo '```'
            grep -E '✓|✘|passed|failed|flaky|skipped' playwright-output.txt | tail -60 || true
            echo '```'
            for f in $(find test-results -name 'perf-*.json' 2>/dev/null); do
              echo "#### $(basename "$f")"; echo '```json'; cat "$f"; echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: irl-web-playwright
          path: |
            apps/web-game/tests/playwright-report
            apps/web-game/tests/test-results
          if-no-files-found: ignore
