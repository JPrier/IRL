name: ci

on:
  push:
  pull_request:

# Bevy + llama.cpp + sherpa-onnx produce very large debug artifacts. Dropping
# debuginfo keeps the hosted runners from filling their disk and speeds links.
env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      # `rpg_inference` links llama.cpp via `llama-cpp-sys-2`, whose bindgen
      # build needs libclang. `apps/bevy-game` pulls winit, which needs the
      # Wayland/X11 development libraries, and `cpal` needs ALSA.
      - name: Install Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev clang pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Drop stale sherpa-onnx prebuilt cache
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libclang-dev clang pkg-config \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Point bindgen at LLVM (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll') {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            Write-Host 'LLVM not found in the default location; bindgen must discover libclang itself.'
          }
      # `rust-cache` can restore a `target/sherpa-onnx-prebuilt` whose `lib`
      # directory exists but is missing the import libraries, which makes the
      # crate skip re-extraction and then fail to link. Force a clean fetch.
      - name: Drop stale sherpa-onnx prebuilt cache
        shell: bash
        run: rm -rf target/sherpa-onnx-prebuilt
      - run: cargo test --workspace
      - run: cargo run -q -p scenario-runner -- --seed 2026
      # Diagnostic (non-neural) speech/WAV buffer benchmark. Run through
      # `rpg_speech` rather than `model-bench`: the latter links llama.cpp and
      # the static onnxruntime together, whose initialisers abort with
      # `std::bad_alloc` on some Linux runners before `main` runs. This example
      # exercises the identical WAV/buffer-accounting path.
      - run: cargo run -q -p rpg_speech --example speech_bench
