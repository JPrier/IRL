name: release

# Build a downloadable, self-contained IRL bundle per OS. The bundle carries the
# executable, its native libraries and (unless slim) the speech models and local
# LLM, so a player needs no Rust toolchain. Triggered by a version tag or
# manually (choose "slim" to skip the ~950 MiB of weights).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      slim:
        description: "Slim bundle (no bundled weights; first-run download)"
        type: boolean
        default: false

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_RELEASE_DEBUG: "0"

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev libudev-dev \
            libwayland-dev libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev
      - name: Fetch assets (full bundle only)
        if: github.event_name == 'push' || inputs.slim != true
        shell: bash
        run: ./scripts/setup.sh
      - name: Package
        shell: bash
        run: |
          if [ "${{ inputs.slim }}" = "true" ]; then
            ./scripts/package.sh --slim
          else
            ./scripts/package.sh
          fi
      - name: Archive bundle
        shell: bash
        run: |
          cd dist
          for d in */; do
            tar -czf "${d%/}.tar.gz" "$d"
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: IRL-${{ matrix.os }}
          path: dist/*.tar.gz
          if-no-files-found: error
